<div class="panel-head">
  <h2>{{.title}}</h2>
  <span class="chip">Snapshot · reapply filters to refresh</span>
</div>
{{if .levelBreakdown}}
<div class="pill-row">
  {{range .levelBreakdown}}
  <a class="pill-count" hx-get="{{.Href}}" hx-target="#logs-panel" hx-swap="innerHTML">{{.Level}} <span class="n">{{.Count}}</span></a>
  {{end}}
</div>
{{end}}
<table class="data-table log-table">
  <thead><tr><th>Time</th><th>Level</th><th>Stream</th><th>Message</th></tr></thead>
  <tbody>
  {{range .entries}}
    <tr>
      <td>{{.TS}}</td>
      <td><span class="status status-{{.Level}}">{{.Level}}</span></td>
      <td>{{.Stream}}</td>
      <td class="log-msg">{{.Message}}</td>
    </tr>
  {{else}}
    <tr><td colspan="4">No logs found for current filters</td></tr>
  {{end}}
  </tbody>
</table>
