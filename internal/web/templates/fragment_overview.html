<h2>Overview</h2>
<div class="stat-tile-row">
  <article class="stat-tile">
    <p class="stat-label">CPU</p>
    <span class="stat-value">{{pct .metric.CPUPct}}</span>
    <span class="spark">{{.cpu_spark}}</span>
  </article>
  <article class="stat-tile">
    <p class="stat-label">Memory</p>
    <span class="stat-value">{{pct .mem_pct}}</span>
    <span class="spark">{{.mem_spark}}</span>
  </article>
  <article class="stat-tile">
    <p class="stat-label">Disk</p>
    <span class="stat-value">{{pct .disk_pct}}</span>
    <span class="spark">{{.disk_spark}}</span>
  </article>
  <article class="stat-tile">
    <p class="stat-label">Load</p>
    <span class="stat-value">{{printf "%.2f %.2f %.2f" .metric.Load1 .metric.Load5 .metric.Load15}}</span>
  </article>
  <article class="stat-tile">
    <p class="stat-label">Uptime</p>
    <span class="stat-value">{{humanizeDuration .metric.UptimeSec}}</span>
  </article>
  <article class="stat-tile">
    <p class="stat-label">Active Alerts</p>
    <span class="stat-value">{{.activeAlerts}}</span>
  </article>
</div>
