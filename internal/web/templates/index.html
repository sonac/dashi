<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashi</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <script src="/static/htmx.min.js"></script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <div>
    <p class="eyebrow">Home Server Observability</p>
    <h1>Dashi</h1>
  </div>
  <nav>
    <a href="#overview">Overview</a>
    <a href="#services">Services</a>
    <a href="#alerts">Alerts</a>
    <a href="#logs">Logs</a>
    <a href="/settings">Settings</a>
  </nav>
</header>

<main class="page-flow">
  <section class="card" id="overview" hx-get="/fragments/overview" hx-trigger="load, every 15s" hx-swap="innerHTML"></section>

  <section class="card" id="services" hx-get="/fragments/services" hx-trigger="load, every 15s" hx-swap="innerHTML"></section>

  <section class="card" id="alerts" hx-get="/fragments/alerts" hx-trigger="load, every 15s" hx-swap="innerHTML"></section>

  <section class="card" id="restarts" hx-get="/fragments/restarts" hx-trigger="load, every 15s" hx-swap="innerHTML"></section>

  <section class="card" id="logs">
    <h2>Logs Explorer</h2>
    <form id="logs-filter" class="inline compact"
          hx-get="/fragments/logs"
          hx-target="#logs-panel"
          hx-swap="innerHTML"
          hx-trigger="submit"
          hx-include="#logs-filter">
      <label>Service ID <input name="service" placeholder="all services"></label>
      <label>Query <input name="q" placeholder="error, timeout, migration"></label>
      <label>Level
        <select name="level">
          <option value="">Any</option>
          <option>ERROR</option>
          <option>WARN</option>
          <option>INFO</option>
          <option>DEBUG</option>
        </select>
      </label>
      <label>Stream
        <select name="stream">
          <option value="">Any</option>
          <option value="stdout">stdout</option>
          <option value="stderr">stderr</option>
        </select>
      </label>
      <label>Range
        <select name="range">
          <option value="">All</option>
          <option value="15m">15m</option>
          <option value="1h" selected>1h</option>
          <option value="6h">6h</option>
          <option value="24h">24h</option>
        </select>
      </label>
      <label>Limit
        <select name="limit">
          <option value="100">100</option>
          <option value="200">200</option>
          <option value="400">400</option>
        </select>
      </label>
      <button type="submit">Apply Filters</button>
    </form>
    <div id="logs-panel">
      <p class="muted">Loading logs…</p>
    </div>
  </section>
</main>

<script src="/static/app.js"></script>
</body>
</html>
